name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-e-smoke:
    name: Build, migrations e smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labflow
          POSTGRES_PASSWORD: labflow
          POSTGRES_DB: labflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labflow -d labflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MAIN_DB_URL: postgresql://labflow:labflow@localhost:5432/labflow
      JWT_SECRET: ci-only-secret-nao-usar-em-producao-0123456789
      FRONT_URL: http://localhost:3001
      PORT: 3000
      # NÃO acrescente NODE_ENV=production aqui achando que aproxima da
      # produção. Duas coisas deste job dependem de ficar fora dela:
      #   - a sonda de readiness bate em /api/docs, e o Swagger só é montado
      #     fora de produção;
      #   - os cookies de sessão sairiam com o atributo `Secure`, e o curl se
      #     recusa a enviá-los sobre http — o smoke test de autenticação
      #     inteiro cairia, sem mencionar cookie nem Secure em lugar nenhum.

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Rodar migrations
        run: npm run migration:run

      - name: Subir a aplicação
        run: |
          node dist/main.js > app.log 2>&1 &
          echo $! > app.pid

          # Espera o servidor responder (Swagger fica em /api/docs fora de produção)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/docs || true)
            if [ "$code" = "200" ]; then
              echo "Aplicação de pé (tentativa $i)."
              exit 0
            fi
            sleep 1
          done

          echo "::error::Aplicação não subiu em 30s"
          cat app.log
          exit 1

      - name: Smoke test — validação e fluxo de auth
        run: |
          set -e

          # 1) Senha fraca deve ser rejeitada pelo servidor (400)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@teste.com","pass":"1"}')
          if [ "$code" != "400" ]; then
            echo "::error::Senha fraca deveria retornar 400, retornou $code"
            cat app.log; exit 1
          fi
          echo "OK: senha fraca rejeitada (400)"

          # 2) Primeiro cadastro do sistema vira admin ativo (201)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Admin","email":"ci@teste.com","pass":"Password123"}')
          if [ "$code" != "201" ]; then
            echo "::error::Signup válido deveria retornar 201, retornou $code"
            cat app.log; exit 1
          fi
          echo "OK: signup do primeiro usuário (201)"

          # 3) Login do primeiro usuário (conta ativa): grava os dois cookies
          #    httpOnly e devolve o perfil no corpo.
          #
          #    Este passo já procurou '"token"' no corpo. Aquilo nunca foi um teste
          #    de login — era um proxy ("veio token, logo funciona") que virou
          #    um teste do contrato que a migração para cookie revogou.
          code=$(curl -s -o signin.json -D signin.headers -c cookies.txt -w '%{http_code}' -X POST http://localhost:3000/auth/signin -H 'Content-Type: application/json' -d '{"email":"ci@teste.com","pass":"Password123"}')
          if [ "$code" != "201" ]; then
            echo "::error::Signin deveria retornar 201, retornou $code"
            cat signin.json; cat app.log; exit 1
          fi

          # O e-mail, e não só a presença de "user": prova que o perfil é o de
          # quem autenticou.
          grep -q '"email":"ci@teste.com"' signin.json || {
            echo "::error::Signin não devolveu o perfil de quem autenticou: $(cat signin.json)"
            cat app.log; exit 1
          }

          # Guarda de regressão do motivo inteiro do cookie httpOnly: se o token
          # voltar ao corpo, o JavaScript da página volta a conseguir lê-lo e
          # guardá-lo, e o cookie perde a razão de existir.
          if grep -q '"token"' signin.json; then
            echo "::error::Signin vazou token no corpo: $(cat signin.json)"
            cat app.log; exit 1
          fi

          for cookie in labflow_access labflow_refresh; do
            grep -i "^set-cookie: $cookie=" signin.headers | grep -qi 'HttpOnly' || {
              echo "::error::Cookie $cookie ausente ou sem HttpOnly no signin"
              grep -i '^set-cookie' signin.headers || true
              cat app.log; exit 1
            }
          done
          echo "OK: signin gravou os dois cookies httpOnly e devolveu o perfil"

          # 4) Segundo cadastro nasce pendente: signin deve retornar 403
          curl -s -o /dev/null -X POST http://localhost:3000/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Comum","email":"ci2@teste.com","pass":"Password123"}'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/auth/signin \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci2@teste.com","pass":"Password123"}')
          if [ "$code" != "403" ]; then
            echo "::error::Conta pendente deveria retornar 403 no signin, retornou $code"
            cat app.log; exit 1
          fi
          echo "OK: conta pendente bloqueada no login (403)"

      # O que o smoke test antigo não conseguia cobrir, e é o que teria pegado
      # a quebra: a sessão inteira anda pelos cookies, sem nenhum header
      # Authorization envolvido. Usa o cookies.txt gravado no signin acima —
      # arquivos persistem entre steps do mesmo job.
      - name: Smoke test — sessão por cookie
        run: |
          set -e

          # 5) Rota protegida SEM Authorization: quem autentica é o cookie.
          code=$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt http://localhost:3000/user)
          if [ "$code" != "200" ]; then
            echo "::error::Rota protegida deveria aceitar o cookie de acesso (200), retornou $code"
            cat app.log; exit 1
          fi
          echo "OK: /user autenticado só com cookie (200)"

          # 6) E sem cookie nenhum, 401 — confirma que o 200 acima veio do
          #    cookie, e não de a rota ter deixado de exigir autenticação.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/user)
          if [ "$code" != "401" ]; then
            echo "::error::Rota protegida sem cookie deveria retornar 401, retornou $code"
            cat app.log; exit 1
          fi
          echo "OK: /user sem cookie rejeitado (401)"

          # 7) Renovação: 204 sem corpo, os dois cookies regravados, sessão de pé.
          code=$(curl -s -o /dev/null -D refresh.headers -w '%{http_code}' -b cookies.txt -c cookies.txt -X POST http://localhost:3000/auth/refresh)
          if [ "$code" != "204" ]; then
            echo "::error::Refresh deveria retornar 204, retornou $code"
            cat app.log; exit 1
          fi
          for cookie in labflow_access labflow_refresh; do
            grep -qi "^set-cookie: $cookie=" refresh.headers || {
              echo "::error::Refresh não regravou o cookie $cookie"
              grep -i '^set-cookie' refresh.headers || true
              cat app.log; exit 1
            }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt http://localhost:3000/user)
          if [ "$code" != "200" ]; then
            echo "::error::Sessão deveria seguir válida após o refresh, /user retornou $code"
            cat app.log; exit 1
          fi
          echo "OK: refresh renovou a sessão (204, dois cookies regravados)"

          # 8) Logout derruba a cadeia no servidor. O refresh seguinte apresenta
          #    um token revogado e tem que ser recusado — é o que impede um
          #    cookie copiado de continuar valendo depois que o usuário saiu.
          code=$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt -X POST http://localhost:3000/auth/logout)
          if [ "$code" != "204" ]; then
            echo "::error::Logout deveria retornar 204, retornou $code"
            cat app.log; exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt -X POST http://localhost:3000/auth/refresh)
          if [ "$code" != "401" ]; then
            echo "::error::Refresh após logout deveria retornar 401, retornou $code"
            cat app.log; exit 1
          fi
          echo "OK: logout revogou a sessão (refresh seguinte 401)"

      - name: Logs da aplicação (em caso de falha)
        if: failure()
        run: cat app.log || true

      - name: Encerrar aplicação
        if: always()
        run: kill "$(cat app.pid)" 2>/dev/null || true

  versionar:
    name: Calcular versão (semantic-release)
    runs-on: ubuntu-latest

    # Só versiona depois que build, migrations e smoke test passaram, e apenas
    # em push direto na main — PR não deve criar release nem tag.
    needs: build-e-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write # criar a tag git e o release
      issues: write # comentar nas issues incluídas no release
      pull-requests: write

    outputs:
      # Fica vazio quando nenhum commit desde a última tag gera release
      # (ex.: só `ci:` ou `cleanup:`). O job seguinte trata esse caso.
      versao: ${{ steps.semantic.outputs.versao }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # semantic-release precisa do histórico e das tags
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rodar semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release@24 \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/github \
            -p @semantic-release/exec \
            semantic-release

  publicar-imagem:
    name: Publicar imagem no Docker Hub
    runs-on: ubuntu-latest
    needs: versionar

    env:
      IMAGE: matheus05/labflow-back
      VERSAO: ${{ needs.versionar.outputs.versao }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Montar lista de tags
        id: tags
        run: |
          # `latest` acompanha a main; a tag com o SHA permite voltar atrás para
          # um commit exato. A tag de versão só existe quando houve release.
          TAGS="${IMAGE}:latest,${IMAGE}:${GITHUB_SHA}"
          if [ -n "$VERSAO" ]; then
            TAGS="${TAGS},${IMAGE}:${VERSAO}"
            echo "Release ${VERSAO} — publicando tag de versão."
          else
            echo "Nenhum release neste push; publicando apenas latest e SHA."
          fi
          echo "lista=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.lista }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.lista }}" | tr ',' '\n' \
            | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
