# Stack de produção do LabFlow.
#
# Diferença central para o docker-compose.yaml da raiz (que é de
# desenvolvimento): aqui NADA é construído. As imagens vêm prontas do Docker
# Hub, publicadas pelo CI de cada repositório. Atualizar produção é `pull` +
# `up -d`, nunca `build`.
#
# As versões vêm do .env e são escritas pelo atualizar.sh a cada deploy. Fixar
# a versão (em vez de seguir `latest`) é o que torna o rollback possível: dá
# para nomear exatamente a que voltar.
#
# Uso na VPS:
#   cd /opt/labflow
#   docker compose -f docker-compose.prod.yaml --env-file .env up -d

name: labflow

services:
  db:
    # Versão fixa de propósito. `postgres:latest` faz o major mudar sozinho num
    # `pull` qualquer, e major novo não lê o datadir do anterior — o container
    # sobe em loop de erro. Trocar de major é migração planejada, não efeito
    # colateral de deploy.
    image: postgres:16-alpine
    restart: unless-stopped

    # `-c timezone`: fuso PADRÃO DO SERVIDOR, herdado por toda sessão, inclusive
    # a do node-postgres (que ignora PGTZ/TZ). É o que faz now()/CURRENT_TIMESTAMP
    # (created_at/updated_at) gravarem no horário de Brasília em vez de UTC.
    command: ['postgres', '-c', 'timezone=America/Sao_Paulo']

    environment:
      POSTGRES_USER: ${MAIN_DB_USER}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD}
      POSTGRES_DB: ${MAIN_DB}
      TZ: America/Sao_Paulo

    # Sem `ports`. O banco é alcançável só pela rede interna do compose — em
    # produção não existe motivo para 5432 aparecer na interface pública.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${MAIN_DB_USER} -d ${MAIN_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  back:
    image: matheus05/labflow-back:${VERSAO_BACK:?defina VERSAO_BACK no .env}
    restart: unless-stopped

    # O entrypoint roda as migrations antes de subir a API; se o banco ainda não
    # aceita conexão, a migration falha e o container reinicia em loop. Esperar
    # o healthcheck evita isso.
    depends_on:
      db:
        condition: service_healthy

    environment:
      MAIN_DB_URL: 'postgresql://${MAIN_DB_USER}:${MAIN_DB_PASSWORD}@db:5432/${MAIN_DB}'
      # Lida pelo `database:` de cada @Entity. O driver do Postgres ignora esse
      # campo ao montar o nome da tabela; passar aqui só mantém o metadado
      # coerente com o resto da stack.
      MAIN_DB: ${MAIN_DB}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      # Origem liberada no CORS. Hoje front e API dividem o mesmo host, então o
      # navegador nem dispara preflight — mas a variável precisa estar certa
      # para o dia em que a API ganhar subdomínio próprio.
      FRONT_URL: ${FRONT_URL}
      # --- Sessão ---------------------------------------------------------
      # Ausentes no .env, chegam como string vazia e o código cai nos padrões
      # (15m / 7 dias / 30s) — o mesmo comportamento de antes de existirem
      # aqui. Declaradas para que ajustar a sessão em produção seja editar o
      # .env, e não este arquivo.
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS}
      REFRESH_REUSE_GRACE_SECONDS: ${REFRESH_REUSE_GRACE_SECONDS}
      # --- Cookies de sessão ----------------------------------------------
      # Hoje front e API saem sob o mesmo host pelo Apache, na raiz: '/' e
      # 'lax' (os padrões) estão corretos. Só mude se o proxy passar a publicar
      # a API sob prefixo, ou se a API ganhar domínio de registro próprio.
      ACCESS_COOKIE_PATH: ${ACCESS_COOKIE_PATH}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE}
      # Nome antigo, usado como fallback de AUTH_COOKIE_SAMESITE.
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE}
      # Redefinição de senha por e-mail. Sem RESEND_API_KEY o envio fica
      # desligado e o fluxo de "esqueci minha senha" não entrega nada.
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES}
      NODE_ENV: production
      TZ: America/Sao_Paulo

    # Só no loopback: quem publica na internet é o Apache do host, com TLS.
    # Publicar em 0.0.0.0 também fura o UFW, porque o Docker escreve direto no
    # iptables e passa por cima das regras dele.
    ports:
      - '127.0.0.1:3000:3000'

    healthcheck:
      # Não existe rota GET pública para sondar: o JwtGuard é global e as únicas
      # rotas @Public() são POST (signup/signin, com rate limit de 5/min). Então
      # a sonda verifica que o servidor RESPONDE HTTP — um 401 já prova que o
      # Nest subiu e está roteando. O grep em "HTTP/" só falha quando não há
      # ninguém escutando, que é o caso que precisa ser detectado.
      test:
        [
          'CMD-SHELL',
          'wget -S --spider -T 5 http://localhost:3000/ 2>&1 | grep -q "HTTP/"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      # Generoso de propósito: as migrations rodam antes de a API responder.
      start_period: 60s

  front:
    image: matheus05/labflow-front:${VERSAO_FRONT:?defina VERSAO_FRONT no .env}
    restart: unless-stopped

    # `service_healthy` em vez de só `depends_on`: é o que faz um deploy ruim
    # falhar de imediato em vez de deixar o front no ar contra uma API morta.
    depends_on:
      back:
        condition: service_healthy

    environment:
      PORT: 3001
      NODE_ENV: production
      TZ: America/Sao_Paulo
      # O server.js do Next standalone escuta em process.env.HOSTNAME, e o
      # Docker preenche essa variável com o ID do container. Sem isto ele binda
      # apenas no IP da rede do container e recusa conexão no loopback — onde o
      # healthcheck sonda.
      HOSTNAME: 0.0.0.0

    ports:
      - '127.0.0.1:3001:3001'

    healthcheck:
      # 127.0.0.1 explícito: `localhost` resolve para ::1 primeiro e o Next não
      # escuta em IPv6.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3001/login']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  postgres_data:
