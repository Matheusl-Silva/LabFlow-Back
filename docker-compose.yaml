services:
  front:
    build:
      context: ../LabFlow-Front
    image: labflow_front:latest
    ports: 
      - 3001:3001
    depends_on:
      - back
      - db
    env_file:
      - ../LabFlow-Front/.env
    restart: always
  back:
    build:
      context: .
    ports:
      - 3000:3000
    image: labflow_back:latest
    depends_on:
      - db
    environment:
      MAIN_DB_URL: "postgresql://${MAIN_DB_USER}:${MAIN_DB_PASSWORD}@db:5432/${MAIN_DB}"
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
    restart: always
  db:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MAIN_DB_USER}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD}
      POSTGRES_DB: ${MAIN_DB}
    ports:
      - '${MAIN_DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: